<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Drako! · Code is Fun</title>
<meta name="description" content="DRAKO! The Hungry Wyrm: a cartoon snake game. Steer Drako the baby dragon, gobble the village gold back from the goblins. Swipe on a phone, arrows on a computer.">
<meta name="theme-color" content="#4E8A2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../shared/drako.svg" type="image/svg+xml">
<link rel="stylesheet" href="drako.css">
</head>
<body>
<div id="app">
	<canvas id="cv" aria-label="Drako"></canvas>
	<div id="safe" aria-hidden="true"></div>

	<!-- the HUD, during play -->
	<div id="hud" class="hud">
		<div class="pill score"><svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#D8930F" stroke="#2A1A0E" stroke-width="3"/><circle cx="20" cy="19" r="11" fill="#FFCC2E"/><path d="M20 11l2.6 5.4 5.9.8-4.3 4.1 1 5.8L20 24.3l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#D8930F"/></svg><span id="hudScore">0</span></div>
		<div class="pill goal"><span id="hudGoal">0 / 12</span><i class="bar"><b id="hudBar"></b></i></div>
		<div class="combo" id="hudCombo">x2</div>
		<button class="btn round stone pause" id="btPause" type="button" data-kl="paused"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
	</div>

	<!-- the arrows on the screen (a setting) -->
	<div id="dpad" class="dpad" aria-hidden="true">
		<button type="button" class="u" data-d="0">&#9650;</button>
		<button type="button" class="l" data-d="3">&#9664;</button>
		<i class="c"></i>
		<button type="button" class="r" data-d="1">&#9654;</button>
		<button type="button" class="d" data-d="2">&#9660;</button>
	</div>

	<!-- the title -->
	<section id="scrTitle" class="screen on">
		<div class="logo">
			<div class="logo-word" data-text="DRAKO!">DRAKO!</div>
			<div class="ribbon tilt" data-k="subtitle">The Hungry Wyrm</div>
		</div>
		<div class="panel menu">
			<button class="btn big pulse" id="btPlay" type="button" data-k="play">Play</button>
			<button class="btn elixir" id="btEndless" type="button"><span data-k="endless">Endless</span> <small id="bestTitle"></small></button>
			<div class="row">
				<button class="btn gold" id="btHow" type="button" data-k="howBtn">How to play</button>
				<button class="btn round stone" id="btSettings" type="button" data-kl="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5.1 1.6 1.3-2 3.4-1.9-.7a7.8 7.8 0 0 1-2 1.2L15.8 21h-4l-.3-2a7.8 7.8 0 0 1-2-1.2l-1.9.7-2-3.4 1.6-1.3a7.6 7.6 0 0 1 0-2.3L5.6 10.3l2-3.4 1.9.7a7.8 7.8 0 0 1 2-1.2L11.8 3h4l.3 2.4a7.8 7.8 0 0 1 2 1.2l1.9-.7 2 3.4-1.6 1.3a7.6 7.6 0 0 1 0 2.3z"/></svg></button>
			</div>
			<span class="nails-b"><i></i><i></i></span>
		</div>
		<a class="back-site" href="../" data-k="backSite">Back to Code is Fun</a>
	</section>

	<!-- the villages -->
	<section id="scrLevels" class="screen">
		<button class="btn small stone back" type="button" data-go="title" data-k="back">Back</button>
		<div class="ribbon" data-k="levelSelect">Choose a village</div>
		<div class="map" id="levelMap"></div>
	</section>

	<!-- how to play -->
	<section id="scrHow" class="screen">
		<div class="panel sheet">
			<div class="ribbon" data-k="howBtn">How to play</div>
			<p data-k="howTo">Swipe or use the arrows to steer Drako.</p>
			<ul class="legend" id="legend"></ul>
			<button class="btn" type="button" data-go="title" data-k="ok">OK!</button>
			<span class="nails-b"><i></i><i></i></span>
		</div>
	</section>

	<!-- pause -->
	<section id="scrPause" class="screen dim">
		<div class="panel sheet">
			<div class="ribbon" data-k="paused">Paused</div>
			<p class="note" id="pauseNote"></p>
			<button class="btn big" id="btResume" type="button" data-k="resume">Resume</button>
			<div class="row">
				<button class="btn gold" id="btRestart" type="button" data-k="restart">Restart</button>
				<button class="btn round stone" id="btSettings2" type="button" data-kl="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5.1 1.6 1.3-2 3.4-1.9-.7a7.8 7.8 0 0 1-2 1.2L15.8 21h-4l-.3-2a7.8 7.8 0 0 1-2-1.2l-1.9.7-2-3.4 1.6-1.3a7.6 7.6 0 0 1 0-2.3L5.6 10.3l2-3.4 1.9.7a7.8 7.8 0 0 1 2-1.2L11.8 3h4l.3 2.4a7.8 7.8 0 0 1 2 1.2l1.9-.7 2 3.4-1.6 1.3a7.6 7.6 0 0 1 0 2.3z"/></svg></button>
			</div>
			<button class="btn red" type="button" data-go="menu" data-k="menu">Menu</button>
			<span class="nails-b"><i></i><i></i></span>
		</div>
	</section>

	<!-- game over -->
	<section id="scrOver" class="screen dim">
		<div class="panel sheet">
			<div class="ribbon" data-k="gameOver">Oh no!</div>
			<div class="record" id="overRecord" data-k="newRecord">New record!</div>
			<div class="big-score" id="overScore">0</div>
			<p class="note" id="overNote"></p>
			<button class="btn big" id="btRetry" type="button" data-k="retry">Retry</button>
			<button class="btn red" type="button" data-go="menu" data-k="menu">Menu</button>
			<span class="nails-b"><i></i><i></i></span>
		</div>
	</section>

	<!-- level complete -->
	<section id="scrWin" class="screen dim">
		<div class="panel sheet">
			<div class="ribbon" id="winTitle" data-k="levelDone">Village saved!</div>
			<div class="stars" id="winStars"><i class="star off"></i><i class="star off mid"></i><i class="star off"></i></div>
			<div class="big-score" id="winScore">0</div>
			<p class="note" id="winNote"></p>
			<button class="btn big" id="btNext" type="button" data-k="next">Next</button>
			<div class="row">
				<button class="btn gold" id="btRetry2" type="button" data-k="retry">Retry</button>
				<button class="btn red" type="button" data-go="menu" data-k="menu">Menu</button>
			</div>
			<span class="nails-b"><i></i><i></i></span>
		</div>
	</section>

	<!-- settings -->
	<section id="scrSettings" class="screen dim">
		<div class="panel sheet">
			<div class="ribbon" data-k="settings">Settings</div>
			<label class="toggle"><span data-k="sound">Sound</span><input type="checkbox" id="setSound"><i></i></label>
			<label class="toggle"><span data-k="music">Music</span><input type="checkbox" id="setMusic"><i></i></label>
			<label class="toggle"><span data-k="dpad">On-screen arrows</span><input type="checkbox" id="setDpad"><i></i></label>
			<label class="toggle"><span data-k="vibration">Vibration</span><input type="checkbox" id="setVibrate"><i></i></label>
			<div class="toggle"><span data-k="language">Language</span><span class="seg"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></span></div>
			<button class="btn" id="btSetBack" type="button" data-k="ok">OK!</button>
			<span class="nails-b"><i></i><i></i></span>
		</div>
	</section>
</div>
<script src="../shared/site.js"></script>
<script src="drako.js"></script>
</body>
</html>
